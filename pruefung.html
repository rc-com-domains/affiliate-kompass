function editSite(id){const s=db.sites.find(s=>s.id===id)||{name:'',domain:'',topics:[],audience:'',language:'DE',status:'aktiv'};modal(id?'Website bearbeiten':'Website hinzufügen','<form id="site-form" class="modal-body"><input type="hidden" name="id" value="'+esc(id||'')+'"><div class="form-grid">'+field('Name','name',s.name)+field('Domain','domain',s.domain,'url')+field('Themen','topics',s.topics.join(', '),'text',true,true,'Mit Komma trennen, zum Beispiel: hund, alltag, erziehung')+field('Zielgruppe','audience',s.audience,'textarea',true)+'<div class="field"><label for="language">Sprache</label><select name="language" id="language" class="control"><option '+(s.language==='DE'?'selected':'')+'>DE</option><option '+(s.language==='EN'?'selected':'')+'>EN</option></select></div></div></form>','<span><small style="color:var(--muted)">* Pflichtfelder</small></span><div class="actions">'+(id?'<button class="btn ghost" data-archive-site="'+id+'">'+(s.status==='aktiv'?'Archivieren':'Reaktivieren')+'</button>':'')+'<button class="btn secondary" data-close>Abbrechen</button><button class="btn primary" type="submit" form="site-form">Website speichern</button></div>')}
function editOffer(id){const o=db.offers.find(o=>o.id===id)||{name:'',provider:'',category:'Buch',description:'',url:'',target:'',code:'',topics:[],scope:'all',sites:[],notes:'',status:'aktiv'};modal(id?'Angebot bearbeiten':'Affiliate-Angebot hinzufügen','<form id="offer-form" class="modal-body"><input type="hidden" name="id" value="'+esc(id||'')+'"><div class="form-grid">'+field('Angebotsname','name',o.name)+field('Anbieter / Partner','provider',o.provider)+'<div class="field full"><label for="category">Kategorie</label><select name="category" id="category" class="control">'+['Buch','Software','Tool','Kurs','Service','App','Membership','Produkt'].map(c=>'<option '+(o.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div>'+field('Freigegebene Beschreibung','description',o.description,'textarea',true)+field('Affiliate-Link / Ziel-Link bei Aktionscode','url',o.url,'url',true)+field('Original-Zieladresse','target',o.target,'url',false,false)+field('Aktionscode','code',o.code,'text',false,false)+field('Thematischer Bereich','topics',o.topics.join(', '),'text',true,true,'Pflicht für jedes Angebot — auch bei späterem Anlegen durch einen Agenten. Mit Komma trennen.')+'<div class="field full"><label>Zentrale Nutzungsfreigabe *</label><div class="radio-row"><label><input type="radio" name="scope" value="all" '+(o.scope==='all'?'checked':'')+'> Alle Websites, auch zukünftige</label><label><input type="radio" name="scope" value="selected" '+(o.scope==='selected'?'checked':'')+'> Ausgewählte Websites</label></div><div id="site-selection" class="check-list '+(o.scope==='all'?'hidden':'')+'">'+db.sites.filter(s=>s.status==='aktiv').map(s=>'<label><input type="checkbox" name="sites" value="'+s.id+'" '+(o.sites.includes(s.id)?'checked':'')+'>'+esc(s.name)+'</label>').join('')+'</div></div>'+field('Hinweise / Quelle','notes',o.notes,'textarea',true,false)+'<div class="field full"><label style="display:flex;align-items:flex-start;gap:9px"><input type="checkbox" name="approved" required> Ich bestätige für diesen Prototyp: Angebot und Link sind zur Nutzung freigegeben.</label><small>Produktiv dürfen ausschließlich tatsächlich freigegebene Angebote in den Bestand.</small></div></div></form>','<span><small style="color:var(--muted)">* Pflichtfelder</small></span><div class="actions">'+(id?'<button class="btn ghost" data-archive-offer="'+id+'">'+(o.status==='aktiv'?'Archivieren':'Reaktivieren')+'</button>':'')+'<button class="btn secondary" data-close>Abbrechen</button><button class="btn primary" type="submit" form="offer-form">Angebot speichern</button></div>')}
function review(id){let p=db.proposals.find(p=>p.id===id),s=db.sites.find(s=>s.id===p.site),o=db.offers.find(o=>o.id===p.offer);modal('Platzierung prüfen','<div class="modal-body"><div class="notice">'+(p.source==='live'?'Echter Artikel · regelbasierter Kandidat. Gelesen: '+esc(new Date(p.observedAt).toLocaleString('de-DE'))+'. Bitte redaktionell prüfen. Eine Freigabe veröffentlicht nichts.':'Beispielvorschlag. Der Artikel wurde nicht von der Website abgerufen. Eine Freigabe veröffentlicht nichts.')+'</div><div class="detail-pair"><div><div class="label">Website & Abschnitt</div><b>'+esc(s.name)+'</b><p>'+esc(p.section)+'</p></div><div><div class="label">Affiliate-Angebot</div><b>'+esc(o.name)+'</b><p>'+esc(o.provider)+' · Nutzung für diese Website erlaubt</p></div></div><div class="article-preview"><div class="eyebrow">Vorschau mit Ergänzung</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.before)+'</p><div class="insertion"><small style="color:var(--cyan)">+ Vorgeschlagene Ergänzung</small><p>'+esc(p.text)+'</p><span style="color:var(--cyan);font-weight:600">Zum Buch →</span><br><small>Affiliate-Link · Bei einem Kauf kann eine Provision entstehen.</small></div></div>'+(p.source==='live'?'<p><a href="'+esc(p.url)+'" target="_blank" rel="noopener">Originalartikel öffnen ↗</a></p>':'')+'<div class="label">Hinterlegter Link</div><div class="link-box">'+esc(o.url)+'</div><div class="label">Warum diese Verbindung passt</div><p class="sub">'+esc(p.reason)+'</p><div class="label">Text anpassen</div><textarea class="control" id="proposal-text" aria-label="Vorschlagstext bearbeiten">'+esc(p.text)+'</textarea></div>','<span class="badge taupe">'+({offen:'Zur Prüfung',freigegeben:'Freigegeben',verworfen:'Verworfen'}[p.status])+'</span><div class="actions">'+(p.status==='offen'?'<button class="btn ghost" data-decision="verworfen" data-id="'+id+'">Verwerfen</button><button class="btn secondary" data-save-proposal="'+id+'">Text speichern</button><button class="btn primary" data-decision="freigegeben" data-id="'+id+'">'+icon('check')+' Freigeben</button>':'<button class="btn secondary" data-decision="offen" data-id="'+id+'">Wieder öffnen</button>')+'</div>',true)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if('match'in d)runMatch();if(d.view){view=d.view;query='';filter='all';render()}if(d.add==='site')editSite();if(d.add==='offer')editOffer();if(d.editSite)editSite(d.editSite);if(d.editOffer)editOffer(d.editOffer);if('close'in d)close();if(d.tab){proposalTab=d.tab;render()}if(d.review)review(d.review);if(d.archiveSite||d.archiveOffer){let item=(d.archiveSite?db.sites:db.offers).find(x=>x.id===(d.archiveSite||d.archiveOffer));item.status=item.status==='aktiv'?'archiviert':'aktiv';save();close();render();toast(item.status==='aktiv'?'Eintrag reaktiviert.':'Eintrag archiviert. Er kann wieder aktiviert werden.')}if(d.decision||d.saveProposal){const p=db.proposals.find(p=>p.id===(d.id||d.saveProposal));let t=document.getElementById('proposal-text').value.trim();if(!t){toast('Bitte einen Vorschlagstext eingeben.');return}p.text=t;if(d.decision)p.status=d.decision;save();close();render();toast(d.decision==='freigegeben'?'Vorschlag freigegeben. Die Website wurde nicht verändert.':d.decision==='verworfen'?'Vorschlag verworfen.':d.decision==='offen'?'Vorschlag wieder geöffnet.':'Vorschlagstext gespeichert.')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('list').innerHTML=listContent()}});
document.addEventListener('change',e=>{if(e.target.id==='status-filter'){filter=e.target.value;document.getElementById('list').innerHTML=listContent()}if(e.target.name==='scope')document.getElementById('site-selection').classList.toggle('hidden',e.target.value==='all')});
document.addEventListener('submit',e=>{if(!['site-form','offer-form'].includes(e.target.getAttribute('id')))return;e.preventDefault();let f=e.target,fd=new FormData(f),item=Object.fromEntries(fd),topics=split(item.topics);if(!topics.length){document.getElementById('f-topics').setCustomValidity('Bitte mindestens ein Thema angeben.');f.reportValidity();document.getElementById('f-topics').setCustomValidity('');return}for(let k of ['name','provider','description','audience'])if(k in item&&!item[k].trim()){toast('Bitte die Pflichtfelder vollständig ausfüllen.');return}for(let k of ['domain','url','target'])if(item[k]){try{let u=new URL(item[k]);if(!['http:','https:'].includes(u.protocol))throw Error();}catch{toast('Bitte eine vollständige http- oder https-Adresse verwenden.');return}}item.topics=topics;if(f.getAttribute('id')==='offer-form'){item.sites=item.scope==='selected'?fd.getAll('sites'):[];if(item.scope==='selected'&&!item.sites.length){toast('Bitte mindestens eine Website auswählen.');return}item.origin=db.offers.find(o=>o.id===item.id)?.origin||'Im Prototyp angelegt';delete item.approved}else if(db.sites.some(s=>s.id!==item.id&&s.domain.replace(/\/$/,'').toLowerCase()===item.domain.replace(/\/$/,'').toLowerCase())){toast('Diese Website ist bereits vorhanden.');return}const list=f.getAttribute('id')==='site-form'?db.sites:db.offers;let old=list.find(x=>x.id===item.id);item.status=old?.status||'aktiv';if(old)Object.assign(old,item);else{item.id=crypto.randomUUID();list.push(item)}save();close();render();toast(f.getAttribute('id')==='site-form'?'Website im Prototyp gespeichert.':'Angebot im Prototyp gespeichert.')});
document.addEventListener('keydown',e=>{const m=document.querySelector('.modal');if(!m)return;if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...m.querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled&&x.getClientRects().length);let first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

function pilotSites(){return db.sites.filter(s=>{try{const u=new URL(s.domain);return s.status==='aktiv'&&u.protocol==='https:'&&['entscheidungsframework.de','www.entscheidungsframework.de','vankompass.de','www.vankompass.de'].includes(u.hostname)}catch{return false}})}
function matchPanel(){const sites=pilotSites();return '<div class="site-card" style="margin-bottom:25px"><div class="section-line"><h2>Luna-Abgleich</h2><span>Keine automatische Veröffentlichung</span></div><div class="toolbar" style="margin-bottom:9px"><label for="match-site" style="font-size:12px">Website</label><select class="control" id="match-site" style="flex:1">'+sites.map(s=>'<option value="'+s.id+'" '+(db.lastRun?.siteId===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select><span class="badge taupe">GPT‑5.6 Luna · echte Bewertung</span></div><p class="sub">Liest Magazinartikel aus der Sitemap: bis zu 30 bei Entscheidungsframework und 100 bei VanKompass. Prüft Nutzungsfreigaben, Themen und vorhandene Affiliate-Links. Luna bewertet passende neue/geänderte Artikel. Höchstens drei Affiliate-Linkstellen pro Artikelseite; neue Vorschläge warten auf Freigabe. Unveränderte Ergebnisse werden wiederverwendet. Demo-Angebote sind ausgeschlossen.</p>'+(!sites.length?'<p class="sub">Bitte Entscheidungsframework oder VanKompass als aktive Website hinterlegen.</p>':'')+'<p id="luna-progress" class="sub" role="status"></p><div id="match-result">'+runReport()+'</div></div>'}
function runReport(){if(db.lastError)return '<div class="notice" role="alert" style="margin-top:15px;margin-bottom:0">'+esc(db.lastError)+'</div>';const r=db.lastRun;if(!r)return '';const currentSite=db.sites.find(s=>s.id===r.siteId);const stale=r.inputSignature&&r.inputSignature!==JSON.stringify({site:currentSite,offers:db.offers});return (stale?'<div class="notice" style="margin-top:15px">Bestand oder Website geändert. Bitte Änderungen erneut abgleichen.</div>':'')+(r.missingPublications?.length?'<div class="notice">'+r.missingPublications.length+' zuvor veröffentlichte Affiliate-Links fehlen beim aktuellen Abruf. Erneut zur Prüfung vorgelegt; Veröffentlichungshistorie bleibt erhalten.</div>':'')+ '<div style="margin-top:17px;border-top:1px solid var(--line);padding-top:15px"><strong style="font-size:12px">Letzter erfolgreicher Abgleich · '+esc(new Date(r.checkedAt).toLocaleString('de-DE'))+'</strong><p class="sub">'+r.articles+' Artikel gelesen · '+r.offers+' zugelassene Angebote · '+r.candidates+' Kandidaten<br>'+r.changedArticles+' neue/geänderte Artikel · '+r.checkedPairs+' Paarungen geprüft · '+r.reusedPairs+' unveränderte Paarungen wiederverwendet</p><details style="margin-top:9px;font-size:12px;color:var(--muted)"><summary>Prüfumfang und Ausschlüsse ansehen</summary><p>'+esc(r.coverage)+'</p>'+Object.entries(r.skipped).map(([reason,n])=>'<p>'+n+' × '+esc(reason)+'</p>').join('')+'<p>'+esc(r.method)+'</p><ul>'+r.articleUrls.map(u=>'<li><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace('https://www.entscheidungsframework.de',''))+'</a></li>').join('')+'</ul></details></div>'}
async function runMatch(){if(matchingBusy)return;const id=document.getElementById('match-site')?.value;const site=db.sites.find(s=>s.id===id);if(!site){toast('Bitte eine aktive Pilot-Website auswählen.');return}matchingBusy=true;db.lastError=null;render();try{const response=await fetch('/api/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({site,offers:db.offers,thresholds:db.thresholds,proposals:db.proposals})});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error+(result.errors?' '+result.errors.map(e=>e.url+': '+e.message).join(' '):''));const old=db.proposals;for(const p of old){if(result.report.missingPublications?.some(x=>x.id===p.id)&&p.publication){p.publicationHistory=[...(p.publicationHistory||[]),p.publication];delete p.publication;p.status='offen';delete p.aiAssessment}}const incoming=result.proposals.map(p=>{p.offerSnapshot=JSON.stringify(db.offers.find(o=>o.id===p.offer));const before=old.find(x=>x.id===p.id);if(before?.publicationHistory)p.publicationHistory=before.publicationHistory;if(before&&before.articleHash===p.articleHash&&before.offerHash===p.offerHash){p.status=before.status;p.text=before.text;if(before.editMode==='replace_inline'){for(const key of ['before','section','editMode','linkText','reason','revisionId','revisionHistory'])p[key]=before[key]}}return p});db.proposals=[...old.filter(p=>p.source==='live'&&(p.site!==site.id||p.verification?.status==='needs_model_confirmation'||(p.status!=='offen'&&!incoming.some(x=>x.id===p.id)))),...incoming];db.lastRun=result.report;db.lastRun.inputSignature=JSON.stringify({site,offers:db.offers});save();proposalTab='offen';toast(result.report.candidates+' Kandidaten aus echten Inhalten. Bitte redaktionell prüfen.')}catch(e){db.lastError='Abgleich fehlgeschlagen: '+e.message;save();toast('Abgleich fehlgeschlagen. Bisherige Vorschläge bleiben erhalten.')}finally{matchingBusy=false;render()}}

render();
</script>
<script>
// Prototype scoring and routing. No publication endpoint is called.
const SCORE_VERSION='rules-1';
db.thresholds=db.thresholds||{automatic:95,review:80};
let reservoirLane='freigabe',reservoirIndex=0;
const norm=s=>String(s||'').toLowerCase();
function assessment(p){
 const o=db.offers.find(x=>x.id===p.offer),s=db.sites.find(x=>x.id===p.site);
 const context=norm([p.title,p.before,p.section,p.reason].join(' '));
 const hits=p.topics||o?.topics.filter(t=>context.includes(norm(t)))||[];
 const author=context.includes('kahneman');
 const precise=/system 1|system 2/.test(context);
 const linkChecked=!!o&&/tag=entscheidungsframework-21/.test(o.url)&&/12\.10\.2026/.test(o.notes||'');
 const parts=[['Themenpassung',Math.min(35,hits.length*12),35,hits.join(', ')||'Keine dokumentierten Thementreffer'],['Lesernutzen',author?20:hits.length>=3?14:8,20,author?'Autor im konkreten Artikelkontext genannt':'Thematische Nähe; Nutzen redaktionell prüfen'],['Platzierung',precise?25:author?22:16,25,p.section],['Geprüfter Link',linkChecked?10:0,10,linkChecked?'SiteStripe-Link und Prüfdatum hinterlegt':'Linkprüfung nicht dokumentiert'],['Website-Freigabe',o&&s&&eligible(o,s)?10:0,10,'Zentrale Nutzungsfreigabe']];
 return {score:Math.min(100,parts.reduce((n,x)=>n+x[1],0)),parts,blocked:!o||!s||!eligible(o,s)||!o.topics.length||!o.description||!o.url};
}
function lane(p){if(['freigegeben','verworfen','simuliert'].includes(p.status))return 'erledigt';const a=assessment(p);if(a.blocked)return 'spaeter';return a.score>=db.thresholds.automatic&&a.parts[3][1]===10?'auto':a.score>=db.thresholds.review?'freigabe':'spaeter'}
function ranked(){return validProposals().map(p=>({...p,assessment:assessment(p)})).sort((a,b)=>b.assessment.score-a.assessment.score||a.id.localeCompare(b.id))}
function keepReservoirDraft(){const field=document.getElementById('reservoir-text');if(!field)return;const p=ranked().filter(p=>lane(p)===reservoirLane)[reservoirIndex];if(p&&field.value.trim()){db.proposals.find(x=>x.id===p.id).text=field.value.trim();save()}}
function autoSimulate(){let count=0;for(const p of validProposals()){if(p.status==='offen'&&lane(p)==='auto'){p.status='simuliert';p.simulatedAt=new Date().toISOString();p.simulatedScore=assessment(p).score;p.simulatedThresholds={...db.thresholds};count++}}return count}
function reservoirView(){const all=ranked(),items=all.filter(p=>lane(p)===reservoirLane);reservoirIndex=Math.min(reservoirIndex,Math.max(0,items.length-1));const p=items[reservoirIndex];return '<div class="site-card" style="margin-bottom:24px"><div class="section-line"><h2>Bewertung & Ausführungsregeln</h2><span>Regelbewertung · keine Erfolgswahrscheinlichkeit</span></div><form id="threshold-form"><div class="form-grid"><div class="field"><label for="auto-threshold">Automatisch ab</label><input class="control" id="auto-threshold" name="automatic" type="number" min="1" max="100" value="'+db.thresholds.automatic+'" required><small>Ab diesem Wert wird die Verlinkung im Prototyp simuliert.</small></div><div class="field"><label for="review-threshold">Zur Freigabe ab</label><input class="control" id="review-threshold" name="review" type="number" min="0" max="99" value="'+db.thresholds.review+'" required><small>Bis unter die Automatik-Schwelle zur Prüfung; darunter zurückgestellt.</small></div></div><div style="display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:18px"><p class="sub">Nutzungsfreigabe und vollständige Angebotsdaten bleiben Pflicht. Echte Websites werden nicht geändert.</p><button class="btn primary" type="submit">Schwellen anwenden</button></div><p id="threshold-error" role="alert" style="color:#a34936"></p></form></div><div class="tabs" role="tablist" aria-label="Reservoir-Bereiche">'+[['freigabe','Zur Freigabe'],['auto','Automatik bereit'],['spaeter','Zurückgestellt'],['erledigt','Bearbeitet']].map(([l,n])=>'<button class="tab '+(reservoirLane===l?'active':'')+'" role="tab" aria-selected="'+(reservoirLane===l)+'" data-lane="'+l+'">'+n+' ('+all.filter(p=>lane(p)===l).length+')</button>').join('')+'</div><div class="section-line"><h2>Reservoir · nach Bewertung sortiert</h2><span>'+items.length+' Einträge'+(p?' · '+(reservoirIndex+1)+' von '+items.length:'')+'</span></div>'+(p?reservoirCard(p):'<div class="empty"><h3>Keine Eintr
